# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The gate comes from package.json; `_ci-node.yml` adds typecheck, test and
# build as their own jobs — it derives which of them exist from the same file.
name: CI

on:
  pull_request:
    branches:
      - main
      - dev
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@c2c3c73a1b38c10e5d4a6dfa76c46749c03c1158 # v0.1.2

  node:
    name: Node
    uses: kirchDev/workflows/.github/workflows/_ci-node.yml@c2c3c73a1b38c10e5d4a6dfa76c46749c03c1158 # v0.1.2
