# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release Please

on:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    if: github.ref_name == 'main'
    permissions:
      contents: write
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_release-please.yml@b7bc3408448d1c0c1266e8c5fe2788c9cf120790 # v0.5.0
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}

  publish-release:
    name: Publish stable release
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@b7bc3408448d1c0c1266e8c5fe2788c9cf120790 # v0.5.0
    with:
      tag-name: ${{ needs.release-please.outputs.tag-name }}

  publish-prerelease:
    name: Publish prerelease
    if: >-
      ${{
        github.ref_name == 'dev'
        || (
          github.ref_name == 'main'
          && !startsWith(github.event.head_commit.message, 'chore(main): release')
          && !startsWith(github.event.head_commit.message, 'chore: release')
        )
      }}
    permissions:
      contents: read
      id-token: write
    uses: kirchDev/workflows/.github/workflows/_publish-npm.yml@b7bc3408448d1c0c1266e8c5fe2788c9cf120790 # v0.5.0
    with:
      prerelease: true
